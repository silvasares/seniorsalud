name: seniorsalud
description: "SeniorSalud - Monitoreo de salud para adultos mayores"
publish_to: 'none'
version: 1.0.2+14

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^5.1.0
  http: ^1.2.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  fl_chart: ^0.71.0
  table_calendar: ^3.2.0
  intl: ^0.20.2
  provider: ^6.1.1
  workmanager: ^0.7.0
  shared_preferences: ^2.5.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/screenshots_originales/
